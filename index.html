<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Great+Vibes&family=Alex+Brush&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<title>Marie's 20th Birthday!</title>

<style>

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: radial-gradient(circle at top, #0b1a3a, #020617);
  overflow: hidden;
  font-family: Montserrat;
  position: relative;

  /* smoother transition */
  transition: background 2.5s ease-in-out;
}

body::before {
  content: "";
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(56,189,248,0.15), transparent 40%),
              radial-gradient(circle, rgba(168,85,247,0.12), transparent 45%),
              radial-gradient(circle, rgba(34,211,238,0.10), transparent 50%);
  animation: floatGlow 18s infinite linear;
  pointer-events: none;
  z-index: 0;

  transition: background 2.5s ease-in-out;
}

@keyframes floatGlow {
  0% { transform: translate(0,0) rotate(0deg); }
  50% { transform: translate(-5%, 5%) rotate(180deg); }
  100% { transform: translate(0,0) rotate(360deg); }
}

body.day {
  background: linear-gradient(
    135deg,
    #38bdf8 0%,
    #60a5fa 35%,
    #93c5fd 70%,
    #dbeafe 100%
  );
}

body.day::before {
  background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 45%),
              radial-gradient(circle, rgba(255,200,255,0.15), transparent 50%),
              radial-gradient(circle, rgba(255,255,180,0.18), transparent 55%);
}

.page-wrapper {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 40px;
  box-sizing: border-box;
  position: relative;
  z-index: 2;
}

.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.3; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1.2); }
}

.particle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: rgba(255,255,255,0.6);
  border-radius: 50%;
  pointer-events: none;
  animation: drift 12s infinite linear;
  z-index: 0;
  filter: blur(1px);
}

@keyframes drift {
  0% { transform: translateY(100vh) translateX(0); opacity: 0; }
  20% { opacity: 0.8; }
  100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
}

.header-box {
  text-align: center;
}

h1 {
  font-family: "Great Vibes", cursive;
  font-size: 90px;
  color: #ffffff;
  text-shadow: 0 0 15px rgba(135, 206, 250, 0.8);
  margin-bottom: 10px;
}

h2 {
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  letter-spacing: 2px;
  color: #dbeafe;
  text-shadow: 0 0 8px rgba(135, 206, 250, 0.6);
}

.login-box {
  width: 90%;
  max-width: 550px;
  padding: 20px;
  border: 2px solid skyblue;
  border-radius: 40px;
  background-color: white;
  box-shadow: 0 0 20px rgba(0, 123, 255, 0.7);
  position: relative;
  z-index: 2;
}

input {
  width: 100%;
  padding: 8px;
  border: 1px solid #000;
}

label {
  font-weight: bold;
}

.button {
  background-color: white;
  color: deepskyblue;
  padding: 8px 45px;
  border: 2px solid deepskyblue;
  border-radius: 10px;
  cursor: pointer;
}

.button:hover {
  background-color: lightskyblue;
  color: white;
}

.modal {
  display: none;
  position: fixed;
  z-index: 10;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.4);
}

.modal-content {
  background-color: white;
  margin: 15% auto;
  padding: 20px;
  width: 50%;
  border-radius: 10px;
  text-align: center;
}

.center-content {
  text-align: center;
}

.hint {
  font-size: 12px;
  margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="page-wrapper">

  <div class="header-box">
    <h1> Marie's 20th! </h1>
    <h2> a birthday gift from ysa (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ </h2>
  </div>

  <div class="login-box">

    <form onsubmit="redirectToPage(event)">

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="user">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password">
      </div>

      <div class="center-content">
        <p class="hint"><i>Hint: Birthday MM/DD/YYYY</i></p>
        <button class="button">Log In</button>
      </div>

    </form>

  </div>

</div>

<!-- MODAL -->
<div id="errorModal" class="modal">
  <div class="modal-content">
    <h3>Login Failed</h3>
    <p>Invalid username or password.</p>
    <button class="modal-button" id="closeModalButton">Close</button>
  </div>
</div>

<script>

const starsContainer = document.getElementById("stars");

for (let i = 0; i < 80; i++) {
    let star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    star.style.animationDuration = (1 + Math.random() * 2) + "s";

    starsContainer.appendChild(star);
}

for (let i = 0; i < 25; i++) {
    let p = document.createElement("div");
    p.className = "particle";

    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (8 + Math.random() * 10) + "s";
    p.style.animationDelay = Math.random() * 5 + "s";

    document.body.appendChild(p);
}

function redirectToPage(event) {
    event.preventDefault();

    const user = document.getElementById('user').value.trim();
    const password = document.getElementById('password').value.trim();

    const modal = document.getElementById('errorModal');
    const closeModalBtn = document.getElementById('closeModalButton');

    function closeModal() {
        modal.style.display = "none";
    }

    if (user === "marielizares" && password === "05062006") {

        document.body.classList.add("day");

        setTimeout(() => {
            window.location.href = "welcome.html";
        }, 1500);

    } else {
        modal.style.display = "block";
        closeModalBtn.onclick = closeModal;

        window.onclick = function(e) {
            if (e.target == modal) closeModal();
        };
    }
}

</script>

</body>
</html>
